title: YSSA
tagline: YONSEI Survival Analysis Lab
description: >-
  연세대학교 생존분석연구실(YSSA)은 생존자료 분석을 위한 통계 방법론과
  관련 이론을 개발하고 이를 실제 자료에 응용하는 연구를 수행합니다.

# ── GitHub Pages 프로젝트 저장소용 설정 ────────────────────────────
# 저장소 이름이 "yssa" 가 아니면 baseurl 을 저장소 이름으로 바꾸세요.
# 나중에 yssa.yonsei.ac.kr 같은 커스텀 도메인을 연결하면
# baseurl 을 "" 로 비우고 url 을 해당 도메인으로 바꿉니다.
baseurl: "/yssa"
url: ""

lab:
  name_en: YONSEI Survival Analysis (YSSA) lab
  name_ko: 연세대학교 생존분석연구실
  intro_en: >-
    In YSSA, we work on developing statistical methods and relevant theories for
    the analysis of survival data, and applying these to real survival data.
  intro_ko: >-
    연세대학교 생존분석연구실에서는 생존자료의 분석을 위한 방법론과 관련 이론을
    개발하고 이를 실제 생존자료에 응용하는 연구를 진행합니다.

  # 첫 화면 소개 글 옆에 들어가는 사진.
  #   assets/img/ 폴더에 파일을 넣고 아래 photo 에 파일명을 적으면 표시됩니다.
  #   파일이 없으면 그림 영역이 자동으로 사라지고 글이 전체 폭을 씁니다.
  #   사진을 아예 쓰지 않으려면 photo 를 "" 로 비우세요.
  photo: "home.jpg"
  photo_alt: "연세대학교 생존분석연구실"
  photo_caption: ""

# News 페이지에 끼워 넣을 Padlet 게시판.
# id 는 Padlet 주소 padlet.com/<사용자>/<이름>-<ID> 의 맨 뒤 <ID> 부분만 적습니다.
#   예) padlet.com/kanggi1/yssa-za2h6l8ox4slv8l7  ->  id: za2h6l8ox4slv8l7
# Padlet 을 쓰지 않으려면 아래 padlet 블록 전체를 지우거나 앞에 # 을 붙이세요.
padlet:
  id: "za2h6l8ox4slv8l7"
  url: "https://padlet.com/kanggi1/yssa-za2h6l8ox4slv8l7"
  heading: "YSSA 게시판"

nav:
  - { name: Home,         url: /            }
  - { name: Members,      url: /members/    }
  - { name: Publications, url: /publications/ }
  - { name: Projects,     url: /projects/   }
  - { name: News,         url: /news/       }

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
